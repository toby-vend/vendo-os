    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};

      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);

            const reader = ds.readable.getReader();

            writer.close();

            while (true) {
              const { done, value } = await reader.read();

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.

tyle: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"f9aba422-3610-4bef-bea5-84870e93aba7\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n<style>\n*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}\n:root{\n  --black:#051412;\n  --black-card:#09221F;\n  --raised:#0E2C28;\n  --green:#8EFEBB;\n  --green-deep:#5DEFA0;\n  --green-dark:#3a8a60;\n  --charcoal:#2C2C2C;\n  --grey-mid:#ABABAB;\n  --grey-soft:#B9C7C0;\n  /* brand hairlines: subtle white, green reserved for accent */\n  --border:rgba(255,255,255,.08);\n  --border-soft:rgba(255,255,255,.06);\n  --border-accent:rgba(142,254,187,.30);\n  --accent-soft:rgba(142,254,187,.12);\n  --white:#FFFFFF;\n  --blue:#60A5FA;--amber:#F5D674;--purple:#A88BE0;\n  --f-primary:'Manrope',sans-serif;\n  --glow:0 0 24px rgba(142,254,187,.18);\n}\n\n/* ── Base: everything Manrope Bold by default ── */\nbody{background:var(--black);background-image:radial-gradient(ellipse 60% 50% at 15% -5%,rgba(142,254,187,.06),transparent 60%),radial-gradient(ellipse 50% 40% at 92% 0%,rgba(142,254,187,.04),transparent 55%);background-attachment:fixed;font-family:var(--f-primary);font-weight:500;color:var(--white);min-height:100vh;padding-bottom:80px}\n\n/* ── Secondary text: Manrope regular ── */\n.sec{font-family:var(--f-primary);font-weight:400}\n\n::-webkit-scrollbar{height:8px;width:5px}\n::-webkit-scrollbar-track{background:var(--black)}\n::-webkit-scrollbar-thumb{background:var(--green);border-radius:3px}\n\n/* ── Header ── */\n.header{background:var(--black);border-bottom:2px solid var(--green);padding:22px 40px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;position:sticky;top:0;z-index:200}\n.logo-badge{display:inline-flex;align-items:center;height:26px}\n.logo-badge img{height:26px;width:auto;display:block}\n.header-meta{color:var(--grey-mid);font-size:12px;margin-left:14px;padding-left:14px;border-left:1px solid var(--border);font-family:var(--f-primary);font-weight:500}\n.header-subtitle{color:var(--green-dark);font-size:11px;margin-top:5px;font-family:var(--f-primary);font-style:normal;font-weight:400}\n.version-pill{background:var(--accent-soft);color:var(--green);border:1px solid var(--border-accent);padding:3px 11px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-left:8px}\n\n/* ── Rationale banner ── */\n.rationale{background:linear-gradient(90deg,rgba(142,254,187,.06),rgba(142,254,187,0));border-bottom:1px solid var(--border);padding:14px 40px;font-size:12px;color:var(--grey-mid);line-height:1.6;font-family:var(--f-primary);font-style:normal;font-weight:400}\n.rationale strong{color:var(--green);font-family:var(--f-primary);font-style:normal;font-weight:800}\n.rationale code{color:var(--green);font-size:10px;background:rgba(142,254,187,.08);padding:1px 5px;border-radius:3px;font-family:var(--f-primary);font-style:normal}\n\n/* ── Tip bar ── */\n.tip-bar{background:var(--black-card);border-bottom:1px solid var(--border);padding:10px 24px;font-size:11px;color:var(--grey-mid);font-family:var(--f-primary);font-style:normal;font-weight:400}\n\n/* ── Platform legend ── */\n.legend{display:flex;gap:7px;flex-wrap:wrap}\n.legend-item{display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green);background:var(--accent-soft);border:1px solid var(--border-accent);padding:4px 11px;border-radius:999px;font-family:var(--f-primary)}\n.legend-dot{display:none}\n\n/* ── Section wrap ── */\n.section-wrap{padding:44px 40px 0}\n\n/* ── Pillar blocks ── */\n.pillars-grid{display:flex;flex-direction:column;gap:48px}\n.pillar-block{position:relative}\n.pillar-header-row{display:flex;align-items:center;gap:14px;margin-bottom:20px}\n.pillar-label{font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--green);background:var(--accent-soft);border:1px solid var(--border-accent);padding:4px 11px;border-radius:999px;font-family:var(--f-primary)}\n.pillar-name{font-size:16px;font-weight:800;color:var(--white);font-family:var(--f-primary)}\n.pillar-desc{font-size:11px;color:var(--grey-mid);margin-left:auto;text-align:right;max-width:300px;line-height:1.5;font-family:var(--f-primary);font-style:normal;font-weight:400}\n\n/* ── Ideas grid ── */\n.ideas-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}\n\n/* ── Idea cards ── */\n.idea-card{background:var(--black-card);border:1px solid var(--border-soft);border-radius:14px;padding:14px 16px;position:relative;transition:all .18s ease}\n.idea-card:hover{border-color:var(--border-accent);box-shadow:var(--glow)}\n/* uniform cards — platform shown by badge label, not colour */\n.idea-card.li,.idea-card.ig,.idea-card.both{border-left:1px solid var(--border-soft)}\n\n.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px}\n.platform-badge{font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;flex-shrink:0;font-family:var(--f-primary);line-height:1.5}\n.platform-badge.li,.platform-badge.ig,.platform-badge.both{background:var(--accent-soft);color:var(--green);border:1px solid var(--border-accent)}\n\n.freq-tag{font-size:8px;color:var(--grey-mid);font-family:var(--f-primary);font-style:normal;font-weight:400;white-space:nowrap}\n.idea-title{font-size:12px;font-weight:800;color:var(--white);margin-bottom:6px;line-height:1.4;font-family:var(--f-primary)}\n.idea-desc{font-size:11px;color:var(--grey-mid);line-height:1.6;margin-bottom:8px;font-family:var(--f-primary);font-style:normal;font-weight:400}\n.idea-example{font-size:10px;color:var(--green);font-style:normal;line-height:1.5;padding:7px 10px;background:rgba(142,254,187,.04);border-left:2px solid rgba(142,254,187,.3);border-radius:0 4px 4px 0;font-family:var(--f-primary);font-weight:400}\n\n/* ── Pillar connector line ── */\n.pillar-rule{height:1px;background:var(--border);margin-bottom:48px}\n\n/* ── Stats ── */\n.stats{margin-top:48px;padding:0 40px;display:flex;gap:12px;flex-wrap:wrap}\n.stat-card{background:var(--black-card);border:1px solid var(--border-soft);border-radius:14px;padding:14px 20px;min-width:120px}\n.stat-num{font-size:24px;font-weight:800;color:var(--green);line-height:1;font-family:var(--f-primary)}\n.stat-label{font-size:10px;color:var(--grey-mid);margin-top:4px;font-family:var(--f-primary);font-style:normal;font-weight:400}\n.stat-compare{font-size:9px;color:var(--green-deep);margin-top:3px;font-family:var(--f-primary);font-style:normal;font-weight:400}\n\n/* ── Strategy table ── */\n.strategy{margin-top:40px;padding:0 40px}\n.strategy h3{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--green);margin-bottom:16px;font-family:var(--f-primary)}\n.strategy-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:8px;overflow:hidden}\n.strategy-cell{background:var(--black-card);padding:12px 14px;font-size:11px;line-height:1.6;font-family:var(--f-primary);font-style:normal;font-weight:400}\n.strategy-cell.head{background:var(--black);font-weight:800;color:var(--green);letter-spacing:.05em;text-transform:uppercase;font-size:10px;font-family:var(--f-primary);font-style:normal}\n.strategy-cell.label{color:var(--white);font-weight:800;font-family:var(--f-primary);font-style:normal}\n\n/* ── Platform breakdown ── */\n.platform-section{margin-top:40px;padding:0 40px}\n.platform-section h3{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--green);margin-bottom:16px;font-family:var(--f-primary)}\n.platform-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n.platform-card{background:var(--black-card);border:1px solid var(--border-soft);border-radius:14px;padding:18px 20px}\n.platform-card.li-card,.platform-card.ig-card{border-top:3px solid var(--green)}\n.platform-card-name{font-size:14px;font-weight:800;margin-bottom:4px;font-family:var(--f-primary)}\n.platform-card-name.li,.platform-card-name.ig{color:var(--green)}\n.platform-card-sub{font-size:10px;color:var(--grey-mid);margin-bottom:14px;font-family:var(--f-primary);font-style:normal;font-weight:400}\n.platform-card ul{list-style:none;padding:0}\n.platform-card li{font-size:11px;color:var(--grey-mid);padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);line-height:1.5;display:flex;gap:8px;align-items:flex-start;font-family:var(--f-primary);font-style:normal;font-weight:400}\n.platform-card li:last-child{border-bottom:none}\n.platform-card li::before{content:'→';color:var(--green);font-size:9px;margin-top:2px;flex-shrink:0;font-style:normal}\n\n/* ── Build notes ── */\n.notes{margin-top:32px;padding:0 40px}\n.notes h3{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--green);margin-bottom:16px;font-family:var(--f-primary)}\n.notes-box{background:var(--black-card);border:1px solid var(--border);border-left:3px solid var(--green);border-radius:8px;padding:20px;font-size:12px;line-height:1.7;color:var(--grey-mid);font-family:var(--f-primary);font-style:normal;font-weight:400}\n.notes-box ul{list-style:none;padding:0;margin-left:0}\n.notes-box li{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);display:flex;gap:10px;align-items:flex-start}\n.notes-box li:last-child{border-bottom:none}\n.notes-box strong{font-family:var(--f-primary);font-style:normal;font-weight:800;color:var(--white)}\n.notes-box .ntag{flex-shrink:0;font-size:9px;font-weight:700;letter-spacing:.08em;padding:3px 9px;border-radius:999px;margin-top:2px;text-transform:uppercase;min-width:64px;text-align:center;font-family:var(--f-primary)}\n.notes-box .ntag.tip,.notes-box .ntag.warn,.notes-box .ntag.note{background:var(--accent-soft);color:var(--green);border:1px solid var(--border-accent)}\n\n@media(max-width:700px){.header{padding:16px 20px}.section-wrap{padding:28px 16px 0}.stats,.strategy,.platform-section,.notes{padding:0 16px}.strategy-grid,.platform-cards{grid-template-columns:1fr}}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- ═══════════ HEADER ═══════════ -->\n<div class=\"header\">\n  <div>\n    <div style=\"display:flex;align-items:center;margin-bottom:6px\">\n      <span class=\"logo-badge\"><img src=\"d4ddc9a7-40e0-40b3-80f8-0605ebe81c57\" alt=\"Vendo Digital\"><\u002Fspan>\n      <span class=\"header-meta\">vendodigital.co.uk<\u002Fspan>\n      <span class=\"version-pill\">v1 · 2026 Plan<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"color:var(--white);font-size:13px;font-weight:800;font-family:var(--f-primary)\">Organic Social Content Plan — 2026<\u002Fdiv>\n    <div class=\"header-subtitle\">Digital marketing agency · LinkedIn &amp; Instagram · Brand awareness focus<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"legend\">\n    <div class=\"legend-item\">LinkedIn<\u002Fdiv>\n    <div class=\"legend-item\">Instagram<\u002Fdiv>\n    <div class=\"legend-item\">Both platforms<\u002Fdiv>\n    <div class=\"legend-item\">1–2× / week<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════ RATIONALE ═══════════ -->\n<div class=\"rationale\">\n  <strong>The approach:<\u002Fstrong> Vendo Digital targets <strong>marketing managers, e-commerce brands, and enterprise clients<\u002Fstrong> — audiences who respond to evidence, data, and authoritative takes. Content is split across <strong>5 pillars<\u002Fstrong> (Behind the Scenes, Client Results, Marketing Tips, Industry News, Team &amp; Culture) with <code>1–2 posts/week<\u002Fcode> per platform. LinkedIn leans into opinion, benchmarks and case studies; Instagram carries visual, saveable formats. Every post should include a number, finding, or concrete example — data-driven is the non-negotiable tone.\n<\u002Fdiv>\n\n<!-- TIP -->\n<div class=\"tip-bar\">15 content ideas across 5 pillars · Click platform badges to filter · Draft prompts available below each idea<\u002Fdiv>\n\n<!-- ═══════════ CONTENT PILLARS ═══════════ -->\n<div class=\"section-wrap\">\n<div class=\"pillars-grid\">\n\n  <!-- ══════════════════════════════ BEHIND THE SCENES ══════════════════════════════ -->\n  <div class=\"pillar-block\">\n    <div class=\"pillar-header-row\">\n      <span class=\"pillar-label\">Pillar 01<\u002Fspan>\n      <span class=\"pillar-name\">Behind the Scenes<\u002Fspan>\n      <span class=\"pillar-desc\">Pull back the curtain on agency craft. Shows process, builds trust, differentiates from black-box competitors.<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"ideas-row\">\n\n      <div class=\"idea-card ig\">\n        <div class=\"card-top\">\n          <span class=\"platform-badge ig\">Instagram<\u002Fspan>\n          <span class=\"freq-tag\">Monthly<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"idea-title\">Creative feedback reel<\u002Fdiv>\n        <div class=\"idea-desc\">Show the team reviewing a piece of creative — what works, what gets cut, and the thinking behind each call. Raw and real. Lets the audience see how good creative judgment actually sounds.<\u002Fdiv>\n        <div class=\"idea-example\">Quick cuts of a creative review in progress: team around a screen, marking up frames, debating a hook line. No client name, no sensitive context — just craft on camera.<\u002Fdiv>\n      <\u002Fdiv>\n\n\n\n      <div class=\"idea-card li\">\n        <div class=\"card-top\">\n          <span class=\"platform-badge li\">LinkedIn<\u002Fspan>\n          <span class=\"freq-tag\">Monthly<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"idea-title\">Tool stack reveal<\u002Fdiv>\n        <div class=\"idea-desc\">Share what software and frameworks the team actually uses and why. Authoritative and genuinely useful to marketing managers evaluating stacks.<\u002Fdiv>\n        <div class=\"idea-example\">\"The 6 tools our team uses daily that most agencies overlook — and the one we stopped using in Q1.\"<\u002Fdiv>\n      <\u002Fdiv>\n\n\n\n      <div class=\"idea-card ig\">\n        <div class=\"card-top\">\n          <span class=\"platform-badge ig\">Instagram<\u002Fspan>\n          <span class=\"freq-tag\">Monthly<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"idea-title\">Day-in-the-life reel<\u002Fdiv>\n        <div class=\"idea-desc\">Fast-paced visual story of how the team operates. Human, dynamic, scroll-stopping. Shows the people behind the brand.<\u002Fdiv>\n        <div class=\"idea-example\">Quick cuts: morning standup → live dashboards → client call → creative review → end of day metric check.<\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"pillar-rule\"><\u002Fdiv>\n\n  <!-- ══════════════════════════════ CLIENT RESULTS ══════════════════════════════ -->\n  <div class=\"pillar-block\">\n    <div class=\"pillar-header-row\">\n      <span class=\"pillar-label\">Pillar 02<\u002Fspan>\n      <span class=\"pillar-name\">Client Results<\u002Fspan>\n      <span class=\"pillar-desc\">Let the numbers do the talking. The strongest proof point for enterprise and e-commerce buyers who want to see outcomes, not promises.<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"ideas-row\">\n\n      <div class=\"idea-card li\">\n        <div class=\"card-top\">\n          <span class=\"platform-badge li\">LinkedIn<\u002Fspan>\n          <span class=\"freq-tag\">Bi-weekly<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"idea-title\">Metric spotlight<\u002Fdiv>\n        <div class=\"idea-desc\">One stat. One insight. Let the number anchor the post, then unpack the single decision that drove it. Short, punchy, credible.<\u002Fdiv>\n        <div class=\"idea-example\">\"We cut CPL by 41% for an e-commerce brand in 90 days. One attribution model change made the difference — here's what it was.\"<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"idea-card both\">\n        <div class=\"card-top\">\n          <span class=\"platform-badge both\">LI + IG<\u002Fspan>\n          <span class=\"freq-tag\">Monthly<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"idea-title\">Before &amp; after breakdown<\u002Fdiv>\n        <div class=\"idea-desc\">Show a client's state before and after working with Vendo. Data-led, not fluffy. Traffic, conversion rate, ROAS — concrete comparisons.<\u002Fdiv>\n        <div class=\"idea-example\">Side-by-side visual: old strategy vs new, with traffic, ROAS, and CPL figures. Industry named, client anonymous if needed.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"idea-card ig\">\n        <div class=\"card-top\">\n          <span class=\"platform-badge ig\">Instagram<\u002Fspan>\n          <span class=\"freq-tag\">Monthly<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"idea-title\">Client story carousel<\u002Fdiv>\n        <div class=\"idea-desc\">Swipeable breakdown of a real campaign with a named client and a clear narrative arc. The story is what earns the save — challenge, strategy, outcome. Requires client sign-off but the payoff in credibility is worth it.<\u002Fdiv>\n        <div class=\"idea-example\">Slide 1: Who they are and the problem they came to us with. Slide 2: What we changed and why. Slide 3: The numbers three months later. Slide 4: What they said about it.<\u002Fdiv>\n      <\u002Fdiv>\n\n\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"pillar-rule\"><\u002Fdiv>\n\n  <!-- ══════════════════════════════ MARKETING TIPS ══════════════════════════════ -->\n  <div class=\"pillar-block\">\n    <div class=\"pillar-header-row\">\n      <span class=\"pillar-label\">Pillar 03<\u002Fspan>\n      <span class=\"pillar-name\">Marketing Tips &amp; Education<\u002Fspan>\n      <span class=\"pillar-desc\">The highest-volume pillar. Demonstrates expertise while giving audiences something genuinely useful to take away. Drives saves, shares, and follows.<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"ideas-row\">\n\n      <div class=\"idea-card li\">\n        <div class=\"card-top\">\n          <span class=\"platform-badge li\">LinkedIn<\u002Fspan>\n          <span class=\"freq-tag\">Weekly<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"idea-title\">Contrarian take<\u002Fdiv>\n        <div class=\"idea-desc\">Challenge a widely-held marketing belief with data or agency experience. Drives comments from senior audiences and signals genuine POV over safe content.<\u002Fdiv>\n        <div class=\"idea-example\">\"Posting every day is hurting your brand. Here's what the data from 14 accounts over 6 months actually shows.\"<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"idea-card ig\">\n        <div class=\"card-top\">\n          <span class=\"platform-badge ig\">Instagram<\u002Fspan>\n          <span class=\"freq-tag\">Weekly<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"idea-title\">Tactical how-to carousel<\u002Fdiv>\n        <div class=\"idea-desc\">Short, actionable tip in carousel format. Designed for saves. Each slide solves one specific problem — no fluff, no padding.<\u002Fdiv>\n        <div class=\"idea-example\">\"3 ways to reduce bounce rate on your product page (without a redesign or developer).\"<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"idea-card li\">\n        <div class=\"card-top\">\n          <span class=\"platform-badge li\">LinkedIn<\u002Fspan>\n          <span class=\"freq-tag\">Monthly<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"idea-title\">Benchmarks post<\u002Fdiv>\n        <div class=\"idea-desc\">Share industry benchmarks for KPIs relevant to marketing managers and e-commerce brands. Highly bookmarkable — positions Vendo as a data source, not just a service provider.<\u002Fdiv>\n        <div class=\"idea-example\">\"Average email open rates, ROAS, and CPL by sector in 2026. Where does your brand sit?\"<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"idea-card li\">\n        <div class=\"card-top\">\n          <span class=\"platform-badge li\">LinkedIn<\u002Fspan>\n          <span class=\"freq-tag\">Quarterly<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"idea-title\">Prediction post<\u002Fdiv>\n        <div class=\"idea-desc\">Make bold, data-informed predictions about digital marketing. Invites debate, earns reshares, builds thought leadership. Be specific — vague predictions are forgettable.<\u002Fdiv>\n        <div class=\"idea-example\">\"5 things we think will define digital marketing in Q3 2026 — and the one trend we think will quietly die.\"<\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"pillar-rule\"><\u002Fdiv>\n\n  <!-- ══════════════════════════════ INDUSTRY NEWS ══════════════════════════════ -->\n  <div class=\"pillar-block\">\n    <div class=\"pillar-header-row\">\n      <span class=\"pillar-label\">Pillar 04<\u002Fspan>\n      <span class=\"pillar-name\">Industry News &amp; Trends<\u002Fspan>\n      <span class=\"pillar-desc\">Keeps the feed timely and positions Vendo as first movers. The key is always pairing news with a Vendo POV — don't just report, react with expertise.<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"ideas-row\">\n\n      <div class=\"idea-card li\">\n        <div class=\"card-top\">\n          <span class=\"platform-badge li\">LinkedIn<\u002Fspan>\n          <span class=\"freq-tag\">Bi-weekly<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"idea-title\">News + Vendo POV<\u002Fdiv>\n        <div class=\"idea-desc\">React to a significant platform update or industry shift with Vendo's expert interpretation. Always end with a concrete implication for brands. Pick the stories worth reacting to rather than chasing every news cycle.<\u002Fdiv>\n        <div class=\"idea-example\">\"Meta just changed how it ranks Reels. Most agencies haven't noticed what it means for e-commerce brands — here's our read.\"<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"idea-card ig\">\n        <div class=\"card-top\">\n          <span class=\"platform-badge ig\">Instagram<\u002Fspan>\n          <span class=\"freq-tag\">Quarterly<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"idea-title\">Quarterly digest graphic<\u002Fdiv>\n        <div class=\"idea-desc\">Clean designed summary of the most significant shifts in digital this quarter. Saveable and shareable. Quarterly cadence means the curation is genuinely selective — only what actually moved the needle makes the cut.<\u002Fdiv>\n        <div class=\"idea-example\">Visual: \"Digital marketing in Q2 2026: 5 things that mattered, 2 things that didn't, and 1 thing to watch going into Q3.\"<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"idea-card li\">\n        <div class=\"card-top\">\n          <span class=\"platform-badge li\">LinkedIn<\u002Fspan>\n          <span class=\"freq-tag\">Monthly<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"idea-title\">Trend radar<\u002Fdiv>\n        <div class=\"idea-desc\">Flag an emerging trend before it goes mainstream. Positions the team as ahead of the curve. Works especially well when others haven't yet written about it.<\u002Fdiv>\n        <div class=\"idea-example\">\"Most brands haven't noticed this shift in B2B buying behaviour yet. We have — and we're already adapting campaigns around it.\"<\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"pillar-rule\"><\u002Fdiv>\n\n  <!-- ══════════════════════════════ TEAM & CULTURE ══════════════════════════════ -->\n  <div class=\"pillar-block\">\n    <div class=\"pillar-header-row\">\n      <span class=\"pillar-label\">Pillar 05<\u002Fspan>\n      <span class=\"pillar-name\">Team &amp; Culture<\u002Fspan>\n      <span class=\"pillar-desc\">Humanises the agency without sacrificing authority. Builds trust with buyers who want to know the people they're working with — especially at enterprise level.<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"ideas-row\">\n\n      <div class=\"idea-card li\">\n        <div class=\"card-top\">\n          <span class=\"platform-badge li\">LinkedIn<\u002Fspan>\n          <span class=\"freq-tag\">Monthly<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"idea-title\">Team expertise spotlight<\u002Fdiv>\n        <div class=\"idea-desc\">Feature a team member sharing a specialist insight in their own words. Humanises the agency, builds trust with prospects, and shows depth of in-house knowledge.<\u002Fdiv>\n        <div class=\"idea-example\">\"Our head of paid media shares the one thing she checks before any campaign goes live — most teams skip it entirely.\"<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"idea-card li\">\n        <div class=\"card-top\">\n          <span class=\"platform-badge li\">LinkedIn<\u002Fspan>\n          <span class=\"freq-tag\">Quarterly<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"idea-title\">Hiring &amp; values post<\u002Fdiv>\n        <div class=\"idea-desc\">Share what Vendo looks for in talent and what the team actually values. Attracts the right clients and hires alike — signals culture to both audiences.<\u002Fdiv>\n        <div class=\"idea-example\">\"We don't hire for experience alone. Here's what matters more at Vendo Digital — and why it shows in the work.\"<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"idea-card both\">\n        <div class=\"card-top\">\n          <span class=\"platform-badge both\">LI + IG<\u002Fspan>\n          <span class=\"freq-tag\">As needed<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"idea-title\">Agency milestone<\u002Fdiv>\n        <div class=\"idea-desc\">Celebrate a genuine win — a work anniversary, a new service launch, a team achievement. Ground it in specifics. Not a press release — a moment.<\u002Fdiv>\n        <div class=\"idea-example\">\"3 years in. Here's what building Vendo Digital has actually taught us — and the one thing we got completely wrong early on.\"<\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════ STATS ═══════════ -->\n<div class=\"stats\">\n  <div class=\"stat-card\">\n    <div class=\"stat-num\">15<\u002Fdiv>\n    <div class=\"stat-label\">Content ideas total<\u002Fdiv>\n    <div class=\"stat-compare\">Across 5 pillars<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"stat-card\">\n    <div class=\"stat-num\">2<\u002Fdiv>\n    <div class=\"stat-label\">Platforms<\u002Fdiv>\n    <div class=\"stat-compare\">LinkedIn + Instagram<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"stat-card\">\n    <div class=\"stat-num\">8–10<\u002Fdiv>\n    <div class=\"stat-label\">Posts per month<\u002Fdiv>\n    <div class=\"stat-compare\">At 1–2× per week cadence<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"stat-card\">\n    <div class=\"stat-num\">3<\u002Fdiv>\n    <div class=\"stat-label\">Weekly formats<\u002Fdiv>\n    <div class=\"stat-compare\">Contrarian · How-to · News POV<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"stat-card\">\n    <div class=\"stat-num\">100%<\u002Fdiv>\n    <div class=\"stat-label\">Data-led tone<\u002Fdiv>\n    <div class=\"stat-compare\">Every post has a number or finding<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════ PLATFORM BREAKDOWN ═══════════ -->\n<div class=\"platform-section\">\n  <h3>◈ Platform content split<\u002Fh3>\n  <div class=\"platform-cards\">\n    <div class=\"platform-card li-card\">\n      <div class=\"platform-card-name li\">LinkedIn<\u002Fdiv>\n      <div class=\"platform-card-sub\">Target: Marketing managers · Enterprise CMOs · E-commerce leads<\u002Fdiv>\n      <ul>\n        <li>Contrarian opinion posts with data backing — drives comments from senior audiences<\u002Fli>\n        <li>Metric spotlights and benchmark posts — positions Vendo as a data source<\u002Fli>\n        <li>News + Vendo POV — bi-weekly reactions to platform updates with expert interpretation<\u002Fli>\n        <li>Team expertise spotlights and values posts — builds person-level trust at enterprise level<\u002Fli>\n        <li>Quarterly prediction posts — earns reshares, builds thought leadership profile<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"platform-card ig-card\">\n      <div class=\"platform-card-name ig\">Instagram<\u002Fdiv>\n      <div class=\"platform-card-sub\">Target: E-commerce brands · Mid-size marketing teams · Younger decision-makers<\u002Fdiv>\n      <ul>\n        <li>Tactical how-to carousels — designed for saves, not just views<\u002Fli>\n        <li>Client story carousels — named, story-led proof with client sign-off<\u002Fli>\n        <li>Quarterly digest graphics — clean visual summary of what actually mattered this quarter<\u002Fli>\n        <li>Day-in-the-life reels — human, fast-paced, shows the team behind the brand<\u002Fli>\n        <li>Creative feedback reels — real creative review moments that show how good judgment sounds<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════ STRATEGY TABLE ═══════════ -->\n<div class=\"strategy\">\n  <h3>◈ Content strategy decisions<\u002Fh3>\n  <div class=\"strategy-grid\">\n    <div class=\"strategy-cell head\">Decision<\u002Fdiv>\n    <div class=\"strategy-cell head\" style=\"color:var(--green)\">Vendo Digital approach<\u002Fdiv>\n\n    <div class=\"strategy-cell label\">Platform choice<\u002Fdiv>\n    <div class=\"strategy-cell\">LinkedIn and Instagram only. LinkedIn reaches the enterprise and mid-market buyers Vendo targets; Instagram carries the visual and e-commerce-oriented content. TikTok and X are deprioritised — not where the core audience makes decisions.<\u002Fdiv>\n\n    <div class=\"strategy-cell label\">Posting cadence<\u002Fdiv>\n    <div class=\"strategy-cell\">1–2× per week per platform. Consistency beats volume. At this cadence, content quality stays high and every post has a purpose. Roughly 8–10 posts per month across both platforms.<\u002Fdiv>\n\n    <div class=\"strategy-cell label\">Tone &amp; voice<\u002Fdiv>\n    <div class=\"strategy-cell\">Data-driven and authoritative. Every post should contain a number, a finding, or a concrete example. Opinion is welcome — but always anchored in evidence. Avoid vague positivity and agency jargon.<\u002Fdiv>\n\n    <div class=\"strategy-cell label\">LinkedIn vs Instagram split<\u002Fdiv>\n    <div class=\"strategy-cell\">LinkedIn carries opinion, benchmarks, case study breakdowns, and POV content. Instagram carries visual, saveable formats — carousels, reels, digest graphics. Some content (before/after, milestones, creative BTS) works on both.<\u002Fdiv>\n\n    <div class=\"strategy-cell label\">Audience targeting<\u002Fdiv>\n    <div class=\"strategy-cell\">Three audiences: marketing managers at mid-size companies, e-commerce brands, and enterprise/corporate clients. Content should speak to at least one of these — posts that try to speak to all three at once tend to resonate with none.<\u002Fdiv>\n\n    <div class=\"strategy-cell label\">What success looks like<\u002Fdiv>\n    <div class=\"strategy-cell\">Brand awareness: follows, reach, saves, and shares — not likes. Track comments from target-profile accounts. If enterprise marketing leads are commenting and resharing, the content is working.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════ CONTENT NOTES ═══════════ -->\n<div class=\"notes\">\n  <h3>◈ Content notes &amp; recommendations<\u002Fh3>\n  <div class=\"notes-box\">\n    <ul>\n      <li><span class=\"ntag tip\">TIP<\u002Fspan><div><strong style=\"color:#fff\">Always lead with the number.<\u002Fstrong> Posts that open with a specific data point outperform those that build to it. \"We cut CPL by 41%\" is a better opener than \"We recently worked with a brand on their paid social...\"<\u002Fdiv><\u002Fli>\n      <li><span class=\"ntag tip\">TIP<\u002Fspan><div><strong style=\"color:#fff\">Weekly anchor formats.<\u002Fstrong> The contrarian take (LinkedIn) and tactical carousel (Instagram) should run weekly like clockwork — they're the foundation. Everything else builds around them.<\u002Fdiv><\u002Fli>\n      <li><span class=\"ntag note\">NOTE<\u002Fspan><div><strong style=\"color:#fff\">News POV posts should be planned around content days, not chased in real time.<\u002Fstrong> Pick the platform updates and industry stories that have lasting relevance — the ones still worth reading a fortnight after they broke. Reacting to everything erodes selectivity; reacting to the right things earns authority.<\u002Fdiv><\u002Fli>\n      <li><span class=\"ntag warn\">WATCH<\u002Fspan><div><strong style=\"color:#fff\">Don't let culture content drift into self-congratulation.<\u002Fstrong> Team milestones and values posts only land when they're grounded in something specific — a lesson, a mistake, a decision. Generic \"we're proud of our team\" posts erode the authoritative tone.<\u002Fdiv><\u002Fli>\n      <li><span class=\"ntag warn\">WATCH<\u002Fspan><div><strong style=\"color:#fff\">Benchmark posts need sourcing.<\u002Fstrong> If sharing industry benchmarks, cite the source or make clear the data is from Vendo's own client base. Unattributed stats damage the data-driven credibility the brand is building.<\u002Fdiv><\u002Fli>\n      <li><span class=\"ntag tip\">TIP<\u002Fspan><div><strong style=\"color:#fff\">Repurpose across platforms with format changes, not content changes.<\u002Fstrong> A LinkedIn opinion post can become an Instagram carousel with the same core argument. Don't create separate content for each platform — adapt the format, keep the substance.<\u002Fdiv><\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"margin-top:40px;text-align:center;color:var(--grey-mid);font-size:11px;font-family:var(--f-primary);font-style:normal\">\n  Vendo Digital — 2026 Organic Social Content Plan · <a href=\"#\" style=\"color:var(--green)\">vendodigital.co.uk<\u002Fa> · Generated May 2026\n<\u002Fdiv>\n\n\n\n<\u002Fbody><\u002Fhtml>"
